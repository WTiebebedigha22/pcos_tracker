name: pcos_tracker
description: "Lunora — PCOS cycle, symptom, and medication tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  connectivity_plus: ^7.1.1
  supabase_flutter: ^2.12.4
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^22.0.1
  get_it: ^9.2.1
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  provider: ^6.1.5+1
  table_calendar: ^3.2.0
  equatable: ^2.0.8
  image_picker: ^1.2.2
  timezone: ^0.11.0
  intl: ^0.20.2
  fl_chart: ^1.2.0
  share_plus: ^13.1.0
  file_picker: ^12.0.0
  path_provider: ^2.1.6
  flutter_secure_storage: 11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
  # - assets/images/

  # Uncomment once you've added Poppins .ttf files to assets/fonts/
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600